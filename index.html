<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>心动铁拳 · 瞄准镜之外</title>
  <style>:root{
  --ui-bg: rgba(20, 20, 28, 0.44);
  --ui-bg-strong: rgba(20, 20, 28, 0.62);
  --ui-border: rgba(255,255,255,0.16);
  --ui-text: rgba(255,255,255,0.92);
  --ui-dim: rgba(255,255,255,0.72);
  --shadow: 0 18px 60px rgba(0,0,0,0.35);

  /* 立绘控制：电脑 */
  --char-scale-desktop: 1.05;
  --char-y-desktop: 0vh;

  /* 立绘控制：手机（你要调大小/高度，优先改这俩） */
  --char-scale-mobile: 1.55;  /* 太大就降：1.45/1.35；太小就升 */
  --char-y-mobile: -6vh;      /* 往上挪更负：-7/-8；往下挪靠近0 */

  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
  --safe-left: env(safe-area-inset-left);
  --safe-right: env(safe-area-inset-right);
}

*{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{
  background:#000;
  font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--ui-text);
  overflow:hidden;
}

.app{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#000;
}

/* 背景层 */
.bg{
  position:absolute;
  inset:0;
  background: #000 center/cover no-repeat;
  transform: translateZ(0);
}

/* 立绘层：用 transform scale + translateY 控制 */
.char-layer{
  position:absolute;
  inset:0;
  pointer-events:none;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-bottom: calc(10px + var(--safe-bottom));
}

.char-img{
  width: min(820px, 92vw);
  height: auto;
  max-height: 94vh;
  object-fit: contain;
  transform-origin: 50% 100%;
  opacity: 1;
  transition: opacity .18s ease, transform .18s ease;
  filter: drop-shadow(0 18px 55px rgba(0,0,0,0.35));
}

/* HUD */
.hud{
  position:absolute;
  left: calc(12px + var(--safe-left));
  right: calc(12px + var(--safe-right));
  top: calc(12px + var(--safe-top));
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  z-index:10;
  pointer-events:auto;
}

.hud-left{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.hud-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.pill{
  border-radius: 14px;
  background: rgba(255,255,255,0.18);
  border:1px solid rgba(255,255,255,0.18);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.btn{
  color: var(--ui-text);
  padding:10px 14px;
  cursor:pointer;
  user-select:none;
  font-size: 14px;
  line-height: 1;
}
.btn:active{ transform: translateY(1px); }
.btn.danger{
  background: rgba(255,80,80,0.22);
  border-color: rgba(255,80,80,0.35);
}

.badge{
  margin-left:8px;
  display:inline-flex;
  min-width: 20px;
  height: 20px;
  padding:0 6px;
  align-items:center;
  justify-content:center;
  border-radius: 999px;
  background: rgba(255,65,65,0.92);
  color:#fff;
  font-size: 12px;
  font-weight: 700;
}
.hidden{ display:none !important; }

.stats{
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:10px;
  color: rgba(0,0,0,0.82);
  background: rgba(255,255,255,0.50);
  border-color: rgba(255,255,255,0.26);
}
.stats b{ color: rgba(0,0,0,0.86); }
.stats .divider{
  width:1px;
  height:16px;
  background: rgba(0,0,0,0.20);
}
.stats .icon{ margin-right:6px; }

/* 对话框 */
.textbox{
  position:absolute;
  left: calc(14px + var(--safe-left));
  right: calc(14px + var(--safe-right));
  bottom: calc(14px + var(--safe-bottom));
  background: var(--ui-bg);
  border: 1px solid var(--ui-border);
  border-radius: 18px;
  padding: 14px 14px 16px 14px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index:12;
  pointer-events:auto;
}

.textbox-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom: 10px;
}

.speaker{
  padding:6px 10px;
  border-radius: 999px;
  background: rgba(0,0,0,0.20);
  border:1px solid rgba(255,255,255,0.14);
  font-size: 13px;
  color: var(--ui-text);
}

.hint{
  font-size: 12px;
  color: rgba(255,255,255,0.72);
}

.text{
  font-size: 20px;
  line-height: 1.55;
  letter-spacing: 0.3px;
  color: rgba(255,255,255,0.92);
  min-height: 2.6em;
  white-space: pre-wrap;
}

/* 选项：固定在对话框上方，不遮太多屏幕 */
.choices{
  position:absolute;
  left: calc(14px + var(--safe-left));
  right: calc(14px + var(--safe-right));
  bottom: calc(160px + var(--safe-bottom));
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  z-index:13;
  pointer-events:auto;
}
.choice{
  flex: 1 1 220px;
  padding: 14px 16px;
  border-radius: 16px;
  background: rgba(255,255,255,0.16);
  border:1px solid rgba(255,255,255,0.18);
  color: rgba(255,255,255,0.92);
  cursor:pointer;
  font-size: 16px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
.choice:active{ transform: translateY(1px); }

/* 面板 */
.panel{
  position:absolute;
  top: calc(64px + var(--safe-top));
  right: calc(14px + var(--safe-right));
  width: min(720px, calc(100vw - 28px - var(--safe-left) - var(--safe-right)));
  height: min(540px, calc(100vh - 92px - var(--safe-top) - var(--safe-bottom)));
  background: var(--ui-bg-strong);
  border:1px solid var(--ui-border);
  border-radius: 18px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index:20;
  overflow:hidden;
  pointer-events:auto;
}

.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding: 12px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.10);
}
.panel-title{
  font-size: 15px;
  color: rgba(255,255,255,0.9);
  font-weight: 600;
}
.panel-body{
  padding: 12px;
  height: calc(100% - 54px);
  overflow:auto;
}

/* 聊天记录 */
.log{
  display:flex;
  flex-direction:column;
  gap:10px;
  font-size: 14px;
  color: rgba(255,255,255,0.88);
}
.log-item{
  padding:10px 12px;
  border-radius: 14px;
  background: rgba(255,255,255,0.10);
  border:1px solid rgba(255,255,255,0.12);
}
.log-item .who{ font-weight:700; margin-right:8px; }

/* 信件 */
.mail-wrap{
  display:grid;
  grid-template-columns: 280px 1fr;
  gap:12px;
  height: 100%;
}
.mail-list{
  border-right: 1px solid rgba(255,255,255,0.10);
  padding-right: 10px;
}
.mail-item{
  padding:10px 10px;
  border-radius: 14px;
  background: rgba(255,255,255,0.10);
  border:1px solid rgba(255,255,255,0.12);
  margin-bottom:10px;
  cursor:pointer;
}
.mail-item.unread{
  border-color: rgba(255,65,65,0.45);
}
.mail-item .t{ font-weight:700; font-size: 14px; }
.mail-item .m{ font-size: 12px; color: rgba(255,255,255,0.70); margin-top:4px; }
.mail-view-title{ font-size: 16px; font-weight:800; }
.mail-view-meta{ font-size: 12px; color: rgba(255,255,255,0.70); margin:6px 0 10px; }
.mail-view-body{ font-size: 14px; line-height: 1.6; white-space: pre-wrap; }

/* Toast */
.toast{
  position:absolute;
  left:50%;
  top: calc(78px + var(--safe-top));
  transform: translateX(-50%);
  background: rgba(255,255,255,0.18);
  border:1px solid rgba(255,255,255,0.18);
  border-radius: 999px;
  padding: 10px 14px;
  z-index:30;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: var(--shadow);
}

/* 结局弹窗 */
.modal{
  position:absolute;
  inset:0;
  background: rgba(0,0,0,0.42);
  z-index:40;
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 20px;
}
.modal-card{
  width: min(520px, 92vw);
  background: rgba(20,20,28,0.82);
  border:1px solid rgba(255,255,255,0.18);
  border-radius: 18px;
  padding: 18px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.modal-title{ font-size: 20px; font-weight:900; margin-bottom: 8px; }
.modal-sub{ color: rgba(255,255,255,0.78); font-size: 14px; }
.modal-badge{
  margin-top: 12px;
  display:inline-flex;
  padding: 10px 14px;
  border-radius: 999px;
  background: rgba(255,255,255,0.18);
  border:1px solid rgba(255,255,255,0.20);
  font-size: 16px;
  font-weight: 900;
}
.modal-actions{
  margin-top: 16px;
  display:flex;
  gap:10px;
  justify-content:flex-end;
}

/* 响应式：手机 */
@media (max-width: 820px){
  .text{ font-size: 18px; }
  .choices{ bottom: calc(172px + var(--safe-bottom)); }
  .panel{
    left: calc(14px + var(--safe-left));
    right: calc(14px + var(--safe-right));
    width: auto;
  }
  .mail-wrap{ grid-template-columns: 1fr; }
  .mail-list{ border-right:none; padding-right:0; }
}

/* 立绘缩放应用 */
@media (min-width: 821px){
  .char-img{
    transform: translateY(var(--char-y-desktop)) scale(var(--char-scale-desktop));
  }
}
@media (max-width: 820px){
  .char-img{
    width: min(760px, 96vw);
    transform: translateY(var(--char-y-mobile)) scale(var(--char-scale-mobile));
  }
}

<body>
  <div id="app" class="app">
    <section class="opening" id="opening"><div class="opening-card"><small>HEARTBEAT / ANA × DOOMFIST</small><h1>心动铁拳<br><em>瞄准镜之外</em></h1><p>每一次相遇，你都在瞄准他。<br>每一次离开，心却没能全身而退。</p><div class="opening-actions"><button id="startStory">进入故事</button></div><p class="opening-note">原创同人故事 · 选择将引向不同结局</p></div></section><audio id="bgm" src="music-small.mp3" loop preload="none"></audio><div class="music-settings" role="group" aria-label="背景音乐控制"><button id="musicToggle" type="button" aria-pressed="true">♫ 音乐：开</button><label for="musicVolume">音量</label><input id="musicVolume" type="range" min="0" max="100" value="40" aria-label="音乐音量"></div>
    <!-- 背景层 -->
    <div id="bg" class="bg" aria-hidden="true"></div>
    <div class="brand"><span>HEARTBEAT / ANA × DOOMFIST</span><strong>瞄准镜之外<span>。</span></strong><small>ANA × DOOMFIST &nbsp; · &nbsp; 心动与交锋</small></div>

    <!-- 立绘层 -->
    <div id="charLayer" class="char-layer" aria-hidden="true">
      <img id="charImg" class="char-img" alt="" />
    </div>

    <!-- 顶部HUD -->
    <div class="hud" id="hud">
      <div class="hud-left">
        <button id="btnChat" class="btn pill">聊天</button>

        <button id="btnMail" class="btn pill">
          信件
          <span id="mailBadge" class="badge hidden">0</span>
        </button>

        <button id="btnReset" class="btn pill danger">重新开始</button>
      </div>

      <div class="hud-right">
        <div class="stats pill">
          <span class="stat">
            <span class="icon">❤</span>
            好感度 <b id="affVal">0</b>
          </span>
          <span class="divider"></span>
          <span class="stat">
            信任 <b id="trustVal">0</b>
          </span>
        </div>
      </div>
    </div>

    <!-- 对话框 -->
    <div id="textbox" class="textbox" role="dialog" aria-label="对话框">
      <div class="textbox-top">
        <span id="speaker" class="speaker">旁白</span>
        <span id="hint" class="hint">点击对话框继续 · ENTER</span>
      </div>
      <div id="text" class="text"></div>
    </div>

    <button id="cgButton" class="cg-button hidden" type="button">▶ 播放结局影像</button>
    <div id="cgModal" class="cg-modal hidden" role="dialog" aria-modal="true" aria-label="特殊 CG"><div class="cg-card"><div class="cg-heading"><span>结局影像 · 瞄准镜之外</span><button id="cgClose" type="button">关闭 ✕</button></div><video id="cgVideo" src="special-cg.mp4" controls playsinline preload="none"></video><p>影像播放时背景音乐会暂停，关闭后恢复。</p></div></div>
    <!-- 选项 -->
    <div id="choices" class="choices hidden" aria-label="选项区"></div>

    <!-- 收到新信件Toast -->
    <div id="toast" class="toast hidden" aria-live="polite">收到新信件</div>

    <!-- 聊天记录面板 -->
    <div id="chatPanel" class="panel hidden" role="dialog" aria-label="聊天记录面板">
      <div class="panel-head">
        <div class="panel-title">聊天记录</div>
        <button class="btn pill" id="btnChatClose">关闭</button>
      </div>
      <div id="chatLog" class="panel-body log"></div>
    </div>

    <!-- 信件面板 -->
    <div id="mailPanel" class="panel hidden" role="dialog" aria-label="信件面板">
      <div class="panel-head">
        <div class="panel-title">信件</div>
        <button class="btn pill" id="btnMailClose">关闭</button>
      </div>
      <div class="panel-body mail-wrap">
        <div id="mailList" class="mail-list"></div>
        <div id="mailView" class="mail-view">
          <div class="mail-view-title" id="mailViewTitle">请选择一封信</div>
          <div class="mail-view-meta" id="mailViewMeta"></div>
          <div class="mail-view-body" id="mailViewBody"></div>
        </div>
      </div>
    </div>

    <!-- 结局弹窗 -->
    <div id="endingModal" class="modal hidden" role="dialog" aria-label="结局弹窗">
      <div class="modal-card">
        <div class="modal-title" id="endingTitle">游戏结束</div>
        <div class="modal-sub" id="endingSub">故事仍在继续</div>
        <div class="modal-badge" id="endingBadge">称号</div>
        <div class="modal-actions">
          <button id="btnRestart" class="btn pill danger">重新开始</button>
          <button id="btnCloseEnding" class="btn pill">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <script type="application/json" id="story-data">{"start": "n01", "mails": {"m01": {"title": "未发送的医疗记录", "from": "安娜的私人档案", "date": "数月前", "body": "右肩擦伤，已包扎。\n患者拒绝留下姓名。\n\n备注：他离开前问我，为什么要救敌人。\n我没有回答。"}, "m02": {"title": "一杯咖啡的时间", "from": "阿坎德", "date": "加密讯息", "body": "你说开罗的咖啡太苦。\n我记得。\n\n如果下一次见面没有枪声，我请你喝一杯。"}, "m03": {"title": "没有寄出的信", "from": "安娜", "date": "私人草稿", "body": "阿坎德：\n\n我一直想问，你在瞄准我之前，是否也会犹豫。\n我在扣下扳机之前，会。\n\n这不是原谅。只是我终于肯承认的事实。"}}, "nodes": {"n01": {"speaker": "旁白", "text": "开罗，凌晨两点。撤离路线被封锁，你伏在屋顶，瞄准镜里映出一只熟悉的金属拳套。", "next": "n02", "bg": "assets/rooftop.png", "char": "assets/charB.png"}, "n02": {"speaker": "安娜", "text": "又是你，阿坎德。", "next": "n03"}, "n03": {"speaker": "旁白", "text": "通讯器传来队友的呼叫。你知道他的习惯：先封住退路，再逼近。作为支援，你早已习惯成为他最先追猎的目标。", "next": "n04"}, "n04": {"speaker": "末日铁拳", "text": "安娜。每一次，我都能找到你。", "next": "n05", "char": "assets/newpose.png"}, "n05": {"speaker": "旁白", "text": "他的声音从近处传来，你却想起数月前的雨夜：他受伤倒在巷子里，你本可以转身离开，却为他包扎了伤口。", "next": "flash1", "mailAdd": "m01", "bg": "assets/alley.png", "char": "assets/charB.png"}, "n06": {"speaker": "安娜", "text": "那次我救你，是因为你流血了。别误会。", "next": "n07", "bg": "assets/rooftop.png"}, "n07": {"speaker": "末日铁拳", "text": "我从不低估你的仁慈。也从不指望它让我赢。", "next": "q1"}, "q1": {"speaker": "旁白", "text": "他的脚步停在阴影里。撤离倒计时仍在跳动，你必须决定如何回应。", "choices": [{"text": "用睡眠镖争取时间，先救队友。", "next": "a1", "affectionDelta": 0, "trustDelta": 1}, {"text": "叫他出来谈，不要把战斗带向平民。", "next": "a2", "affectionDelta": 1, "trustDelta": 2}, {"text": "问他：那晚之后，你为什么没有忘记我？", "next": "a3", "affectionDelta": 2, "trustDelta": 0}]}, "a1": {"speaker": "旁白", "text": "飞镖擦过他的肩，迫使他后退。你趁机通知队友改变路线。", "next": "b1"}, "a2": {"speaker": "末日铁拳", "text": "你总是先想到别人。好，给他们一分钟。", "next": "b1"}, "a3": {"speaker": "末日铁拳", "text": "因为你明明知道我是谁，还是伸出了手。", "next": "b1", "mailAdd": "m02"}, "b1": {"speaker": "旁白", "text": "你们在废弃的天台上对峙。远处的街灯亮着，近处只有呼吸声和无线电里的杂音。", "next": "b2", "char": "assets/newpose.png"}, "b2": {"speaker": "末日铁拳", "text": "你总能从我的拳下逃走。", "next": "b3"}, "b3": {"speaker": "安娜", "text": "因为我还有人要保护。而你每次追过来，都让我很难做到这一点。", "next": "b4"}, "b4": {"speaker": "旁白", "text": "他没有反驳。你曾在狭窄的走廊里被他逼退，也曾在雨中听他平静地谈起失去右臂后的日子。你比任何人都清楚，这两个人是同一个人。", "next": "mid1", "char": "assets/charB.png"}, "b5": {"speaker": "末日铁拳", "text": "我相信冲突会让人类变强。你相信守护。我不要求你改变。", "next": "b6"}, "b6": {"speaker": "安娜", "text": "可你的信念会伤害我想保护的人。你不能要我假装看不见。", "next": "q2"}, "q2": {"speaker": "末日铁拳", "text": "那就告诉我，安娜。站在你面前的我，究竟是敌人，还是别的什么？", "choices": [{"text": "敌人。但我也在乎你，这让我痛苦。", "next": "c1", "affectionDelta": 2, "trustDelta": 2, "mailAdd": "m03"}, {"text": "你是敌人。我不会拿队友的安全冒险。", "next": "c2", "affectionDelta": 0, "trustDelta": 2}, {"text": "我不知道，但我想再相信你一次。", "next": "c3", "affectionDelta": 2, "trustDelta": 1, "mailAdd": "m02"}]}, "c1": {"speaker": "旁白", "text": "话说出口时，你握枪的手没有颤抖。承认感情，并不意味着放下自己的立场。", "next": "d1", "char": "assets/pose.png"}, "c2": {"speaker": "末日铁拳", "text": "我明白。你守护他们，正如我不会背弃自己的道路。", "next": "d1"}, "c3": {"speaker": "末日铁拳", "text": "信任不是要求来的。我会记住你给我的这一次机会。", "next": "d1", "char": "assets/pose.png"}, "d1": {"speaker": "旁白", "text": "通讯器突然响起：撤离车遭到袭击，队友被困在路口。你望向阿坎德；他也听见了。", "next": "late1", "char": "assets/newpose.png"}, "d2": {"speaker": "末日铁拳", "text": "这不是我的命令。但你没有时间确认了。", "next": "d3"}, "d3": {"speaker": "安娜", "text": "让开。", "next": "d4"}, "d4": {"speaker": "旁白", "text": "他侧身让出道路，机械护手垂在身侧。你知道自己仍然无法预料他的下一步。", "next": "q3", "char": "assets/pose.png"}, "q3": {"speaker": "旁白", "text": "直升机的声音越来越近。你最后看了他一眼。", "choices": [{"text": "先救队友。向他约定，下次再把话说完。", "next": "end1", "affectionDelta": 1, "trustDelta": 1}, {"text": "告诉他：如果再伤害我的人，我会亲手阻止你。", "next": "end2", "affectionDelta": 0, "trustDelta": 2}, {"text": "留下一枚通讯器，给彼此一次选择的机会。", "next": "end3", "affectionDelta": 2, "trustDelta": 1, "mailAdd": "m03"}]}, "end1": {"speaker": "旁白", "text": "你跃下天台，奔向撤离点。身后没有追击。\n\n几天后，一条没有署名的讯息亮起：「那杯咖啡，我还记得。」你没有立刻回复，却也没有删除。", "end": {"title": "结局 · 未完的约定", "badge": "我们还有下一次"}}, "end2": {"speaker": "旁白", "text": "他没有拦你，只是在你转身时低声说：「我从未怀疑过。」\n\n你们的道路仍然对立。那份不能言说的牵挂，被留在了两人都不肯跨过的边界上。", "end": {"title": "结局 · 瞄准镜之外", "badge": "爱意不能代替原谅"}, "cg": true}, "end3": {"speaker": "旁白", "text": "你把通讯器放在地上，没有回头。\n\n很久之后，它传来他的声音：「安娜，你安全了吗？」\n\n你望向晨光中的城市，轻声回答：「这一次，是的。」", "end": {"title": "结局 · 微弱信号", "badge": "在距离之间，留一条线"}}, "flash1": {"speaker": "旁白", "text": "那是一次任务结束后的暴雨。你躲进巷子处理伤口，发现他靠在墙边，肩头的血已经浸透了衬衫。", "next": "flash2"}, "flash2": {"speaker": "安娜", "text": "别动。再逞强，你会失血过多。", "next": "flash3"}, "flash3": {"speaker": "末日铁拳", "text": "你总是这样对待敌人？", "next": "flash4"}, "flash4": {"speaker": "安娜", "text": "我先是医生，然后才是你的敌人。", "next": "flash5"}, "flash5": {"speaker": "旁白", "text": "他看着你取出绷带，既没有反抗，也没有卸下防备。雨声很大，你们不得不靠得更近才能听清彼此。", "next": "flash6"}, "flash6": {"speaker": "末日铁拳", "text": "你不怕我趁这个时候动手？", "next": "flash7"}, "flash7": {"speaker": "安娜", "text": "怕。但害怕和见死不救，是两回事。", "next": "flash8"}, "flash8": {"speaker": "旁白", "text": "他低头看你打结的手。那一刻，你们都没有提守望先锋或黑爪，仿佛这条小巷暂时不属于任何一方。", "next": "flash9"}, "flash9": {"speaker": "旁白", "text": "你偶然见过他卸下戒备的模样。那段影像藏在记忆里，直到现在仍会在不合时宜的时候浮现。", "next": "flash10"}, "flash10": {"speaker": "末日铁拳", "text": "安娜，如果我们不是在这样的世界相遇……", "next": "flash11"}, "flash11": {"speaker": "安娜", "text": "不要说。我们都知道这个问题没有答案。", "next": "flash12"}, "flash12": {"speaker": "旁白", "text": "雨停时，他留下了一句「下次见面，我不会手下留情」。你以为那只是威胁，却记住了他回头的样子。", "next": "n06"}, "mid1": {"speaker": "安娜", "text": "你知道最让我生气的是什么吗？每次我以为自己已经看清你，你又做出一件让我犹豫的事。", "next": "mid2"}, "mid2": {"speaker": "末日铁拳", "text": "犹豫让你活到了现在。那不是弱点。", "next": "mid3"}, "mid3": {"speaker": "安娜", "text": "有一次你冲进后排，我只来得及用睡眠镖挡住你。那一刻，我是真的以为自己会死。", "next": "mid4"}, "mid4": {"speaker": "末日铁拳", "text": "而你站起来后，第一件事是治疗身边的人。", "next": "mid5"}, "mid5": {"speaker": "旁白", "text": "他记得。他记得那些你以为只是任务报告里一行数字的瞬间。这个发现比追击本身更让你心乱。", "next": "mid6"}, "mid6": {"speaker": "安娜", "text": "你不该记得这些。", "next": "mid7"}, "mid7": {"speaker": "末日铁拳", "text": "我也试过不去想。没有成功。", "next": "mid8"}, "mid8": {"speaker": "旁白", "text": "你们之间只隔着几步。你没有放下枪，他也没有再靠近。那段距离，既是界限，也是你们还能说话的原因。", "next": "b5"}, "late1": {"speaker": "旁白", "text": "你按住通讯器，告诉队友坚持住。远处的警报声划破夜色，你不能再耽搁。", "next": "late2"}, "late2": {"speaker": "安娜", "text": "他们不是我们争论的一部分。", "next": "late3"}, "late3": {"speaker": "末日铁拳", "text": "我知道。", "next": "late4"}, "late4": {"speaker": "旁白", "text": "他抬手接通自己的通讯，冷静地下达命令。你听不清回应，却看见远处路口的火光渐渐停了。", "next": "late5"}, "late5": {"speaker": "安娜", "text": "你为什么帮他们？", "next": "late6"}, "late6": {"speaker": "末日铁拳", "text": "我说过，那不是我的命令。我不需要借他们的命向你证明什么。", "next": "late7"}, "late7": {"speaker": "旁白", "text": "你想说谢谢，话到嘴边却变得沉重。一次援手不能抹去过去，也不能保证未来。", "next": "late8"}, "late8": {"speaker": "末日铁拳", "text": "不要把这一刻当作承诺，安娜。", "next": "late9"}, "late9": {"speaker": "安娜", "text": "我不会。但我会记得。", "next": "late10"}, "late10": {"speaker": "旁白", "text": "他的目光停在你身上，像是有更多的话想说。最后，他只是让出通往楼梯的路。", "next": "d2"}}}</script>
<script>const ASSETS = {"assets/rooftop.png": "assets/rooftop.webp", "assets/alley.png": "assets/alley.webp", "assets/pose.png": "assets/pose.webp", "assets/charB.png": "assets/charB.webp", "assets/newpose.png": "assets/newpose.webp"};
(() => {
  const LS_KEY = "doomfist_ana_romance_v3";

  const els = {
    bg: document.getElementById("bg"),
    charImg: document.getElementById("charImg"),
    speaker: document.getElementById("speaker"),
    text: document.getElementById("text"),
    hint: document.getElementById("hint"),
    textbox: document.getElementById("textbox"),
    choices: document.getElementById("choices"),

    affVal: document.getElementById("affVal"),
    trustVal: document.getElementById("trustVal"),

    btnChat: document.getElementById("btnChat"),
    btnMail: document.getElementById("btnMail"),
    btnReset: document.getElementById("btnReset"),

    chatPanel: document.getElementById("chatPanel"),
    chatLog: document.getElementById("chatLog"),
    btnChatClose: document.getElementById("btnChatClose"),

    mailPanel: document.getElementById("mailPanel"),
    mailList: document.getElementById("mailList"),
    mailViewTitle: document.getElementById("mailViewTitle"),
    mailViewMeta: document.getElementById("mailViewMeta"),
    mailViewBody: document.getElementById("mailViewBody"),
    btnMailClose: document.getElementById("btnMailClose"),
    mailBadge: document.getElementById("mailBadge"),

    toast: document.getElementById("toast"),

    endingModal: document.getElementById("endingModal"),
    endingTitle: document.getElementById("endingTitle"),
    endingBadge: document.getElementById("endingBadge"),
    btnRestart: document.getElementById("btnRestart"),
    btnCloseEnding: document.getElementById("btnCloseEnding"),
  };

  /** @type {{start:string,nodes:Object<string,any>,mails?:Object<string,any>}} */
  let STORY = null;

  let state = {
    nodeId: null,
    affection: 0,
    trust: 0,
    // 当前显示（用于继承）
    currentBg: null,
    currentChar: null,

    // 历史记录
    history: [], // [{speaker,text}]
    visited: [],

    // 信件
    mailbox: {
      unlocked: [], // ["m01","m02"...]
      read: []      // ["m01"...]
    }
  };

  function safeParse(jsonStr) {
    try { return JSON.parse(jsonStr); } catch { return null; }
  }

  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (_) { /* Browsing still works when storage is unavailable. */ }
  }

  function load() {
    let raw = null;
    try { raw = localStorage.getItem(LS_KEY); } catch (_) {}
    const obj = raw ? safeParse(raw) : null;
    if (obj && typeof obj === "object") {
      // 合并字段，避免旧存档缺字段
      state = {
        ...state,
        ...obj,
        mailbox: {
          unlocked: Array.isArray(obj?.mailbox?.unlocked) ? obj.mailbox.unlocked : [],
          read: Array.isArray(obj?.mailbox?.read) ? obj.mailbox.read : [],
        }
      };
    }
  }

  function resetAll() {
    try { localStorage.removeItem(LS_KEY); location.reload(); } catch (_) { state = { nodeId: STORY.start, affection: 0, trust: 0, currentBg: null, currentChar: null, history: [], visited: [], mailbox: { unlocked: [], read: [] } }; closeEnding(); setNode(STORY.start); }
  }

  function showToast(msg = "收到新信件") {
    els.toast.textContent = msg;
    els.toast.classList.remove("hidden");
    setTimeout(() => els.toast.classList.add("hidden"), 1500);
  }

  function clampInt(n) {
    const x = Number(n);
    if (!Number.isFinite(x)) return 0;
    return Math.trunc(x);
  }

  function applyDelta(nodeOrChoice) {
    if (!nodeOrChoice) return;
    state.affection += clampInt(nodeOrChoice.affectionDelta || 0);
    state.trust += clampInt(nodeOrChoice.trustDelta || 0);
  }

  function addHistory(speaker, text) {
    if (!text) return;
    state.history.push({ speaker: speaker || "旁白", text });
    if (state.history.length > 60) state.history.shift();
  }

  function isUnlocked(mailId) {
    return state.mailbox.unlocked.includes(mailId);
  }
  function isRead(mailId) {
    return state.mailbox.read.includes(mailId);
  }
  function markRead(mailId) {
    if (!isRead(mailId)) state.mailbox.read.push(mailId);
  }
  function unlockMail(mailId) {
    if (!mailId) return;
    if (!STORY?.mails?.[mailId]) return; // story里没有定义就忽略
    if (!isUnlocked(mailId)) {
      state.mailbox.unlocked.push(mailId);
      showToast("收到新信件");
    }
  }

  function unreadCount() {
    return state.mailbox.unlocked.filter(id => !isRead(id)).length;
  }

  function updateMailBadge() {
    const n = unreadCount();
    if (n > 0) {
      els.mailBadge.textContent = String(n);
      els.mailBadge.classList.remove("hidden");
    } else {
      els.mailBadge.classList.add("hidden");
    }
  }

  function renderChatLog() {
    els.chatLog.innerHTML = "";
    const frag = document.createDocumentFragment();
    state.history.slice(-40).forEach(item => {
      const div = document.createElement("div");
      div.className = "log-item";
      div.innerHTML = `<span class="who">${escapeHtml(item.speaker)}：</span>${escapeHtml(item.text)}`;
      frag.appendChild(div);
    });
    els.chatLog.appendChild(frag);
    els.chatLog.scrollTop = els.chatLog.scrollHeight;
  }

  function renderMailList() {
    els.mailList.innerHTML = "";
    const ids = state.mailbox.unlocked.slice().reverse(); // 新的在前
    if (ids.length === 0) {
      els.mailList.innerHTML = `<div style="opacity:.8;font-size:14px;">暂无信件（在剧情节点/选项中解锁）</div>`;
      return;
    }
    const frag = document.createDocumentFragment();
    ids.forEach(id => {
      const m = STORY.mails[id];
      const item = document.createElement("div");
      item.className = "mail-item" + (!isRead(id) ? " unread" : "");
      const from = m.from ? `来自：${m.from}` : "";
      item.innerHTML = `<div class="t">${escapeHtml(m.title || id)}</div><div class="m">${escapeHtml(from)}</div>`;
      item.addEventListener("click", () => openMail(id));
      frag.appendChild(item);
    });
    els.mailList.appendChild(frag);
  }

  function openMail(id) {
    const m = STORY.mails[id];
    if (!m) return;
    markRead(id);
    updateMailBadge();
    save();

    els.mailViewTitle.textContent = m.title || id;
    els.mailViewMeta.textContent = (m.from ? `来自：${m.from}` : "") + (m.date ? `  ·  ${m.date}` : "");
    els.mailViewBody.textContent = m.body || "";
    // 刷新列表的未读样式
    renderMailList();
  }

  function openPanel(panelEl) {
    panelEl.classList.remove("hidden");
  }
  function closePanel(panelEl) {
    panelEl.classList.add("hidden");
  }

  function openEnding(title, badge) {
    els.endingTitle.textContent = title || "游戏结束";
    els.endingBadge.textContent = badge || "称号";
    els.endingModal.classList.remove("hidden");
  }
  function closeEnding() {
    els.endingModal.classList.add("hidden");
  }

  function escapeHtml(s) {
    return String(s ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function setNode(id) {
    if (!STORY.nodes[id]) {
      // 找不到节点：直接报错到对话框
      els.speaker.textContent = "ERROR";
      els.text.textContent = `找不到节点：${id}`;
      els.choices.classList.add("hidden");
      save();
      return;
    }
    state.nodeId = id;
    render();
    save();
  }

  function render() {
    const node = STORY.nodes[state.nodeId];
    document.getElementById("cgButton").classList.toggle("hidden", !node.cg);

    // 先应用节点本身的增量（进入节点就加）
    // 注意：只在“首次进入”时加更合理，但为了简单可控，
    // 我们用一个节点访问标记避免重复加
    if (!state.visited.includes(state.nodeId)) {
      state.visited.push(state.nodeId);
      applyDelta(node);
      if (node.mailAdd) unlockMail(node.mailAdd);
    }

    // 背景：只有显式提供 bg 才切换，否则继承
    if ("bg" in node) {
      state.currentBg = node.bg || state.currentBg;
    }
    if (state.currentBg) {
      els.bg.style.backgroundImage = `url("${ASSETS[state.currentBg] || state.currentBg}")`;
    }

    // 立绘：只有显式提供 char 才切换/隐藏，否则继承
    if ("char" in node) {
      if (node.char) {
        state.currentChar = node.char;
        els.charImg.src = ASSETS[state.currentChar] || state.currentChar;
        els.charImg.classList.toggle("approach", state.currentChar === "assets/pose.png");
        els.charImg.style.opacity = "1";
      } else {
        // 显式隐藏
        els.charImg.style.opacity = "0";
      }
    } else {
      // 继承
      if (state.currentChar) {
        els.charImg.src = ASSETS[state.currentChar] || state.currentChar;
        els.charImg.classList.toggle("approach", state.currentChar === "assets/pose.png");
        els.charImg.style.opacity = "1";
      }
    }

    // 文本
    const sp = node.speaker || "旁白";
    const tx = node.text || "";
    els.speaker.textContent = sp;
    els.text.textContent = tx;

    // 加入历史记录（避免空文本）
    if (!state.history.length || state.history[state.history.length - 1].nodeId !== state.nodeId) {
      addHistory(sp, tx);
      state.history[state.history.length - 1].nodeId = state.nodeId;
    }
    updateStatsUI();

    // 选项
    if (Array.isArray(node.choices) && node.choices.length > 0) {
      renderChoices(node.choices);
      els.choices.classList.remove("hidden");
      els.hint.textContent = "请选择一个选项";
    } else {
      els.choices.classList.add("hidden");
      els.hint.textContent = "点击对话框继续";
    }

    // 结局
    if (node.end) {
      // end: { title, badge }
      els.hint.textContent = "点击查看结局";
    }

    // 邮箱红点
    updateMailBadge();
  }

  function updateStatsUI() {
    els.affVal.textContent = String(state.affection);
    els.trustVal.textContent = String(state.trust);
  }

  function renderChoices(choices) {
    els.choices.innerHTML = "";
    const frag = document.createDocumentFragment();

    choices.forEach((c) => {
      const btn = document.createElement("button");
      btn.className = "choice";
      btn.textContent = c.text || "（未命名选项）";
      btn.addEventListener("click", (ev) => {
        ev.stopPropagation();

        // 选项增量
        applyDelta(c);
        if (c.mailAdd) unlockMail(c.mailAdd);

        // 进下一节点
        if (c.next) {
          setNode(c.next);
        }
      });
      frag.appendChild(btn);
    });

    els.choices.appendChild(frag);
  }

  function advance() {
    const node = STORY.nodes[state.nodeId];
    // 有选项则不允许点对话框推进（避免误触）
    if (Array.isArray(node.choices) && node.choices.length > 0) return;

    if (node.end) { openEnding(node.end.title, node.end.badge); if (node.cg) document.getElementById("cgButton").click(); return; }
    if (node.next) {
      setNode(node.next);
      return;
    }

    // 没有 next：提示已到末尾
    els.speaker.textContent = "系统";
    els.text.textContent = "已到达当前分支末尾。你可以点击 RESET 重新开始。";
  }

  async function init() {
    // 加载 story.json
    let story;
    try {
      story = JSON.parse(document.getElementById("story-data").textContent);
    } catch (e) {
      els.speaker.textContent = "ERROR";
      els.text.textContent = "story.json 加载失败：请检查文件是否存在、是否为合法 JSON。";
      console.error(e);
      return;
    }

    // 校验
    if (!story || typeof story !== "object" || !story.start || !story.nodes) {
      els.speaker.textContent = "ERROR";
      els.text.textContent = "story.json 缺少 start 或 nodes 字段";
      return;
    }
    STORY = story;
    if (!STORY.mails) STORY.mails = {};

    // 读档
    load();

    // 初始化默认背景/立绘（避免空白）
    if (!state.currentBg) state.currentBg = "assets/bg.png";
    if (!state.currentChar) state.currentChar = "assets/charB.png";

    // 如果没节点，就从 start 开始
    if (!state.nodeId) state.nodeId = STORY.start;

    // 绑定事件
    els.textbox.addEventListener("click", () => advance());

    els.btnReset.addEventListener("click", () => { if (confirm("确定重新开始？当前进度将被清除。")) resetAll(); });

    // 聊天记录按钮
    els.btnChat.addEventListener("click", () => {
      renderChatLog();
      openPanel(els.chatPanel);
    });
    els.btnChatClose.addEventListener("click", () => closePanel(els.chatPanel));

    // 信件按钮
    els.btnMail.addEventListener("click", () => {
      renderMailList();
      openPanel(els.mailPanel);
      updateMailBadge();
      save();
    });
    els.btnMailClose.addEventListener("click", () => closePanel(els.mailPanel));

    // 结局
    els.btnRestart.addEventListener("click", resetAll);
    els.btnCloseEnding.addEventListener("click", closeEnding);
    els.endingModal.addEventListener("click", (e) => {
      if (e.target === els.endingModal) closeEnding();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { closePanel(els.chatPanel); closePanel(els.mailPanel); closeEnding(); return; }
      if ((e.key === "Enter" || e.key === " ") && e.target === document.body && els.chatPanel.classList.contains("hidden") && els.mailPanel.classList.contains("hidden") && els.endingModal.classList.contains("hidden")) { e.preventDefault(); advance(); }
    });

    const syncDialogHeight = () => document.documentElement.style.setProperty("--dialog-height", els.textbox.offsetHeight + "px");
    if (window.ResizeObserver) new ResizeObserver(syncDialogHeight).observe(els.textbox);
    window.addEventListener("resize", syncDialogHeight);
    syncDialogHeight();

    // 首次渲染
    // 重要：清掉 nodes 的 _visited 标记（从 JSON 读入可能残留？这里确保每次刷新都是干净的）
    Object.values(STORY.nodes).forEach(n => { if (n && typeof n === "object") delete n._visited; });

    render();
    save();
  }

  init();
})();
</script>

<script>
(() => {
 const start=document.getElementById('startStory'), opening=document.getElementById('opening'), audio=document.getElementById('bgm'), toggle=document.getElementById('musicToggle'), volume=document.getElementById('musicVolume');
 let enabled=true;
 audio.volume=Number(volume.value)/100;
 const play=()=>{if(enabled) audio.play().catch(()=>{});};
 start.addEventListener('click',()=>{opening.hidden=true;opening.style.display='none';play();});
 toggle.addEventListener('click',()=>{
   enabled=!enabled;toggle.setAttribute('aria-pressed',String(enabled));
   if(enabled)play();else audio.pause();
   toggle.textContent=enabled?'♫ 音乐：开':'♫ 音乐：关';
 });
 volume.addEventListener('input',()=>{audio.volume=Number(volume.value)/100;});
 audio.addEventListener('play',()=>{toggle.textContent='♫ 音乐：开';});
})();
</script>
<script>
(()=>{const button=document.getElementById('cgButton'), modal=document.getElementById('cgModal'), close=document.getElementById('cgClose'), video=document.getElementById('cgVideo'), bgm=document.getElementById('bgm');let resume=false;button.addEventListener('click',()=>{resume=!bgm.paused;bgm.pause();modal.classList.remove('hidden');video.currentTime=0;video.play().catch(()=>{});});function dismiss(){video.pause();modal.classList.add('hidden');if(resume)bgm.play().catch(()=>{});resume=false;}close.addEventListener('click',dismiss);modal.addEventListener('click',e=>{if(e.target===modal)dismiss();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.classList.contains('hidden'))dismiss();});})();
</script></body>
</html>
